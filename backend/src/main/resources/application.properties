spring.application.name=simulator

# --- KAFKA PRODUCER SETTINGS (Sending Data) ---
spring.kafka.producer.bootstrap-servers=localhost:9092
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# --- KAFKA CONSUMER SETTINGS (Receiving Data) ---
spring.kafka.consumer.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=cold-storage-matchers
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# =======================================================
# --- DATABASE CONNECTION SETTINGS (The "Memory") ---
# =======================================================
# Changed from food_waste_db to food_waste
spring.datasource.url=jdbc:postgresql://localhost:5432/food_waste

# Changed from postgres to user
spring.datasource.username=user

spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false