spring.application.name=simulator

# ============================================
# KAFKA PRODUCER SETTINGS
# ============================================
spring.kafka.producer.bootstrap-servers=localhost:9092
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# ============================================
# KAFKA CONSUMER SETTINGS
# ============================================
spring.kafka.consumer.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=cold-storage-matchers
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# ✅ KAFKA CONSUMER ORDERING
spring.kafka.listener.concurrency=1
spring.kafka.consumer.max-poll-records=1
spring.kafka.consumer.session-timeout-ms=30000

# ============================================
# DATABASE CONNECTION
# ============================================
spring.datasource.url=jdbc:postgresql://localhost:5432/food_waste
spring.datasource.username=user
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ============================================
# ✅ NEW: ML ENGINE CONFIGURATION
# ============================================
ml.engine.url=http://localhost:8000
ml.engine.timeout-ms=5000
ml.engine.enabled=true