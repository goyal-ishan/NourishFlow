spring.application.name=simulator

# ============================================
# SERVER
# ============================================
server.port=${PORT:8080}

# ============================================
# DATABASE (Supabase PostgreSQL)
# ============================================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Explicit PostgreSQL Dialect (Fixes the Render metadata crash)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ============================================
# FRONTEND & ML ENGINE
# ============================================
frontend.url=${FRONTEND_URL:http://localhost:3000}
ml.engine.url=${ML_ENGINE_URL:http://localhost:8000}
ml.engine.timeout-ms=5000
ml.engine.enabled=true

# ============================================
# KAFKA (Aiven)
# ============================================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}

# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Consumer
spring.kafka.consumer.group-id=cold-storage-matchers
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# Consumer Ordering
spring.kafka.listener.concurrency=1
spring.kafka.consumer.max-poll-records=1
spring.kafka.consumer.session-timeout-ms=30000

# ============================================
# KAFKA SECURITY (Aiven SCRAM-SHA-512)
# ============================================
spring.kafka.properties.security.protocol=${KAFKA_SECURITY_PROTOCOL:SASL_SSL}
spring.kafka.properties.sasl.mechanism=${KAFKA_SASL_MECHANISM:SCRAM-SHA-512}
spring.kafka.properties.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username='${KAFKA_SASL_USERNAME}' password='${KAFKA_SASL_PASSWORD}';